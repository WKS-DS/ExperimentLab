# Theme for ExperimentLab. Chart colors live in ui/charts.py and match these.

[client]
toolbarMode = "minimal"

[theme]
base = "light"

# Controls stay neutral ink so that color on the page only comes from the
# data: blue for a correct detection, red for an error.
primaryColor = "#1A2230"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F8"
textColor = "#1A2230"
borderColor = "#DCE1E8"
showWidgetBorder = false
showSidebarBorder = false
baseRadius = "6px"

blueColor = "#2A78D6"
redColor = "#E34948"
grayColor = "#5A6472"

font = "'Libre Franklin':https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&display=swap"
headingFont = "'Libre Franklin':https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&display=swap"
baseFontSize = 15
headingFontSizes = ["2rem", "1.5rem", "1.125rem", "1rem", "0.875rem", "0.8rem"]
headingFontWeights = [700, 600, 600, 600, 600, 600]

[theme.sidebar]
backgroundColor = "#F3F5F8"
secondaryBackgroundColor = "#FFFFFF"
